services:
  daycheck:
    build: .
    image: daycheck
    container_name: daycheck
    ports:
      - "3003:3003"
    restart: unless-stopped
    volumes:
      # Calendars storage (JSON files), kept across image updates and restarts
      - daycheck-data:/app/data
    # Settings are read from a ".env" file next to this one (see .env.example),
    # values after ":-" are the defaults used when a variable isn't set
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-}
      MAX_CALENDARS: ${MAX_CALENDARS:-10000}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-200}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-365}

volumes:
  # External volume: never created nor deleted by docker compose (not even with `down -v`)
  # Create it once with: docker volume create daycheck-data
  daycheck-data:
    external: true
    name: daycheck-data
