services:
  daycheck:
    build: .
    image: daycheck
    container_name: daycheck
    ports:
      - "3003:3003"
    restart: unless-stopped
    volumes:
      # Calendars storage (one JSON file per calendar), on the host so they survive
      # image updates and can be read directly (FTP, backups...).
      # Defaults to the "calendars" folder next to this file. It must be writable by uid 1000:
      #   mkdir -p calendars && sudo chown 1000:1000 calendars
      - ${CALENDARS_PATH:-./calendars}:/app/data
    # Settings are read from a ".env" file next to this one (see .env.example),
    # values after ":-" are the defaults used when a variable isn't set
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-}
      MAX_CALENDARS: ${MAX_CALENDARS:-10000}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-200}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-365}
